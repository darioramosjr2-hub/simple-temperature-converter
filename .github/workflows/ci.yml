name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./simple-temperature-converter
        run: |
          python -m pip install --upgrade pip
          cat requirements.txt
          python -m pip install -r requirements.txt
          python -m pip freeze

      - name: Verify httpx import
        working-directory: ./simple-temperature-converter
        run: |
          python - <<'PY'
          try:
              import httpx
              print('httpx', httpx.__version__)
          except Exception as e:
              print('httpx import failed:', e)
              import sys
              sys.exit(1)
          PY

      - name: Run tests
        working-directory: ./simple-temperature-converter
        run: pytest -q

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          docker build -t simple-temperature-converter:latest ./simple-temperature-converter
