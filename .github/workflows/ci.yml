name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ./simple-temperature-converter/requirements.txt ]; then
            cat ./simple-temperature-converter/requirements.txt
            python -m pip install -r ./simple-temperature-converter/requirements.txt
          else
            cat requirements.txt
            python -m pip install -r requirements.txt
          fi
          python -m pip freeze

      - name: Verify httpx import
        run: |
          python - <<'PY'
          try:
              import httpx
              print('httpx', httpx.__version__)
          except Exception as e:
              print('httpx import failed:', e)
              import sys
              sys.exit(1)
          PY

      - name: Run tests
        run: |
          if [ -d ./simple-temperature-converter ]; then
            python -m pytest ./simple-temperature-converter -q
          else
            python -m pytest -q
          fi

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          if [ -d ./simple-temperature-converter ]; then
            docker build -t simple-temperature-converter:latest ./simple-temperature-converter
          else
            docker build -t simple-temperature-converter:latest .
          fi
