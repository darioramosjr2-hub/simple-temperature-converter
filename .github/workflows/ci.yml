name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:latest
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ./simple-temperature-converter/requirements.txt ]; then
            cat ./simple-temperature-converter/requirements.txt
            python -m pip install -r ./simple-temperature-converter/requirements.txt
          else
            cat requirements.txt
            python -m pip install -r requirements.txt
          fi
          python -m pip freeze

      - name: Verify httpx import
        run: |
          python - <<'PY'
          try:
              import httpx
              print('httpx', httpx.__version__)
          except Exception as e:
              print('httpx import failed:', e)
              import sys
              sys.exit(1)
          PY

      - name: Run tests
        env: 
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          DB_HOST: localhost
        run: |
          if [ -d ./simple-temperature-converter ]; then
            python -m pytest ./simple-temperature-converter -q
          else
            python -m pytest -q
          fi

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with: 
          # This tells Docker where your code is
          context: ${{ github.workspace }}/simple-temperature-converter
          push: true
          # Replace 'your-username' with your actual Docker Hub username
          tags: ${{ secrets.DOCKER_USERNAME }}/temp-api:latest
        
      - name: Build & Push Consumer image
        uses: docker/build-push-action@v5
        with: 
          context: ${{ github.workspace }}/simple-temperature-converter
          push: true
          # Replace 'your-username' with your actual Docker Hub username
          tags: ${{ secrets.DOCKER_USERNAME }}/temp-consumer:latest
